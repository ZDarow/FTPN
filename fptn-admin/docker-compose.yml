services:
  fptn-admin-backend:
    build: ./backend
    restart: unless-stopped
    environment:
      - JWT_TTL_MINUTES=${JWT_TTL_MINUTES:-60}
      # Обязательные переменные: compose падает на старте, если они не заданы.
      # Раньше здесь стояли дефолты admin/admin и CORS_ORIGINS=*, то есть
      # панель поднималась с заведомо известными логином и паролем.
      - ADMIN_LOGIN=${ADMIN_LOGIN:?задайте ADMIN_LOGIN в .env}
      - ADMIN_PASSWORD=${ADMIN_PASSWORD:?задайте ADMIN_PASSWORD в .env}
      - USERS_FILE=/etc/fptn/users.list
      - ADMINS_FILE=/etc/fptn/admins.json
      - CORS_ORIGINS=${CORS_ORIGINS:?задайте CORS_ORIGINS в .env}
      - ENABLE_BROTLI_COMPRESSION=${ENABLE_BROTLI_COMPRESSION:-false}
      - SERVERS_FILE=/etc/fptn/servers.json
      - PREMIUM_SERVERS_FILE=/etc/fptn/premium_servers.json
      - CENSORED_SERVERS_FILE=/etc/fptn/servers_censored_zone.json
      - BOT_SETTINGS_FILE=/etc/fptn/bot_settings.json
      - TELEGRAM_TOKEN=${TELEGRAM_TOKEN:-}
      - BOT_ENABLED=${BOT_ENABLED:-false}
      - SERVICE_NAME=${SERVICE_NAME:-fptn}
      - MAX_USER_SPEED_LIMIT=${MAX_USER_SPEED_LIMIT:-30}
      - WELCOME_MESSAGE_EN=${WELCOME_MESSAGE_EN:-}
      - WELCOME_MESSAGE_RU=${WELCOME_MESSAGE_RU:-}
    volumes:
      - ${FPTN_CONFIGS_FOLDER:-./compose-data}:/etc/fptn:rw
    ports:
      - "8000:8000"

  fptn-admin-frontend:
    build: ./frontend
    restart: unless-stopped
    init: true # quiets nginx's SIGCHLD noise from the healthcheck's wget
    depends_on: [fptn-admin-backend]
    volumes:
      - ${FPTN_CONFIGS_FOLDER:-./compose-data}:/etc/fptn:rw
    ports:
      - "2663:443"
      - "8080:80"
